# Test config for ha_autopanel component with LVGL
# This validates LVGL widget creation

substitutions:
  device_name: CrowPanel_7_P4
  build_root: C:/
  esphome_version: "2026.4.5" # pip install esphome==2026.4.5

esphome:
  name: test-dynamic-discovery
  friendly_name: ${device_name}
  # build_path at C:/esphome_tdd is OUTSIDE the project so the
  # absolute paths to the source files are short - the linker
  # command line on Windows can otherwise exceed the 32k char
  # CreateProcess limit ("command line too long" error from
  # idf.py at link time). The recommended fix is
  # `-Wl,--use-response-file` but that requires patching the
  # IDF build system, not exposed via ESPHome YAML. Keeping
  # the build path short works around it. The dependency-
  # resolution step also runs `git rev-parse` to find the
  # project version; we ran into 'fatal: not a git repository'
  # errors when the project is heavy on add_idf_component()
  # calls. C:/esphome_tdd is set up as a permanent git repo by
  # ./bootstrap-build.ps1 in this dir - run that script (not
  # `git init` by hand) if the IDF ever says the build dir is
  # not a git repo. See BUILD.md for the simple workflow.
  build_path: ${build_root}/${device_name}
  environment_variables:
    PLATFORMIO_WORKSPACE_DIR: "${build_root}/${device_name}"
    PLATFORMIO_CORE_DIR: "${build_root}/${device_name}"

  on_boot:
    priority: -1000
    then:
      - logger.log: "Backlight ON"
      - output.turn_on: backlight_pwm
      - delay: 200ms
      - output.turn_off: power_light
      - delay: 500ms
      - light.turn_on:
          id: back_light
          brightness: 1

esp32:
  variant: esp32p4
  engineering_sample: true
  cpu_frequency: 360MHZ
  flash_size: 16MB
  partitions: partitions.csv
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    # v1.22q: bump the IDF freeRTOS task watchdog (TWDT)
    # timeout from 5s (default) to 30s. The 5s default is
    # too aggressive for the P4 + ESP32-C6 wifi co-processor
    # setup - the SDIO link occasionally takes 6-8 seconds
    # to recover from a transient. With a 5s timeout, any
    # wifi hiccup trips the TWDT and the panel reboots
    # itself (rst:0xc SW_CPU_RESET). 30s gives the SDIO
    # driver plenty of slack while still catching real
    # hangs. This is idempotent: ESPHome re-emits the
    # sdkconfig option on every build.
    sdkconfig_options:
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
      # v1.22u: WiFi RMT (Radio Mgmt Task) buffer + AMPDU
      # tuning for the ESP32-C6 wifi co-processor. The
      # defaults limit throughput on the P4 + C6 link.
      # Bumping static to 16 and dynamic to 64/64 + 32-
      # station BA windows matches the vendor IDF examples
      # for similar 7-10" panel workloads and has been
      # stable in Crowpanel testing.
      CONFIG_WIFI_RMT_STATIC_RX_BUFFER_NUM: "16"
      CONFIG_WIFI_RMT_DYNAMIC_RX_BUFFER_NUM: "64"
      CONFIG_WIFI_RMT_DYNAMIC_TX_BUFFER_NUM: "64"
      CONFIG_WIFI_RMT_AMPDU_TX_ENABLED: y
      CONFIG_WIFI_RMT_TX_BA_WIN: "32"
      CONFIG_WIFI_RMT_AMPDU_RX_ENABLED: y
      CONFIG_WIFI_RMT_RX_BA_WIN: "32"
      # v1.22u: LWIP TCP buffer tuning. The default TCP
      # send window (16KB) is the bottleneck for the live
      # state-poll bulk /api/states fetch (200KB+). The
      # default TCP receive mailbox (6) DoSes when HA
      # pushes 200+ entity state_changed events in a burst.
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "65534"
      CONFIG_LWIP_TCP_WND_DEFAULT: "65534"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "64"
      CONFIG_LWIP_UDP_RECVMBOX_SIZE: "64"
      CONFIG_LWIP_TCPIP_RECVMBOX_SIZE: "64"
      CONFIG_LWIP_TCP_SACK_OUT: y
      # v1.25c7+: enable FreeRTOS trace facility. Required
      # for uxTaskGetSystemState() (the WLED-style task
      # monitor's pre-crash state walk).
      CONFIG_FREERTOS_USE_TRACE_FACILITY: y
      # Keeps the panic handler in IRAM so it can run even
      # if the main flash/PSRAM is wedged.
      CONFIG_ESP32_PANIC_HANDLER_IRAM: y
      # Prints the interrupt context in the task-dump on
      # panic.
      CONFIG_FREERTOS_INTERRUPT_BACKTRACE: y
      # Catches stack overflow at the precise byte, which
      # makes it obvious which task is over-running.
      CONFIG_FREERTOS_WATCHPOINT_END_OF_STACK: y
      # P4+C6 SDIO wedge fix: reserve an internal-SRAM DMA
      # pool so the SDIO driver can always satisfy
      # sdio_push_data_to_queue's buffer alloc even when
      # the general heap is fragmented. The sdio assert at
      # sdio_drv.c:896 / 928 was firing ~20s into boot
      # because tlsf_malloc couldn't find a contiguous
      # DMA-capable slot for an inbound RPC packet. The
      # hardening mode carves out a reserved pool that
      # SDIO / crypto / DMA ops can fall back to.
      CONFIG_ESP_SYSTEM_MEM_FRAGMENTATION_HARDENING: y
      # v1.28: route malloc() to PSRAM. P4 hex-mode PSRAM at
      # 200MHz is comfortably fast for heap traffic (no
      # perceptible UI or parse slowdown on the 25KB aggregate
      # JSON). The payoff: every default-allocator allocation
      # - std::string temporaries in ArduinoJson's
      # JsonDeserializer::parseObject, std::string copies
      # from as<std::string>(), the small std::strings in
      # Entity::state before we migrated to psram_string,
      # etc. - lands in PSRAM instead of the 384KB internal
      # heap. With this on, the cxx_exception_stubs aborts
      # from internal-RAM OOM in std::bad_alloc go away
      # without us having to convert every remaining
      # std::string field in ha_autopanel. DMA-capable
      # allocations stay in internal SRAM because they
      # explicitly request MALLOC_CAP_INTERNAL via
      # heap_caps_malloc, which this option doesn't change.
      # See project_psram_allocator_naming and the
      # arduinojson.org/v7/how-to/use-external-ram-on-esp32
      # writeup.
      CONFIG_SPIRAM_USE_MALLOC: y

psram:
  speed: 200MHz

esp_ldo:
  - channel: 3
    voltage: 2.5V
  - channel: 4
    voltage: 2.5V

esp32_hosted:
  variant: esp32c6
  active_high: true
  reset_pin: GPIO32
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  # v1.22x: lower SDIO frequency 20MHz -> 10MHz. The default
  # 20MHz causes sdio_rx_get_buffer() to assert in sdio_drv.c:896
  # (*buf == NULL) when the host drains the SDIO ring buffer
  # too slowly during a 200KB+ bulk /api/states transfer. The
  # buffer pool is drained by the httpd task (which is also
  # parsing JSON + allocating), and at 20MHz the C6 outpaces
  # the drain. 10MHz gives the host ~2x more time per buffer
  # without any code change. v1.22v on this hardware survived
  # the same transfer with the 20MHz default; v1.22w's std::function
  # fix avoided the secondary abort, but the underlying SDIO
  # wedge was still present. 10MHz is the documented workaround
  # for the SDIO link stability issue.
  sdio_frequency: 10MHz

logger:
  hardware_uart: UART0 # alternatively, USB_SERIAL_JTAG
  level: INFO
  # logs:
  #   ha_autopanel: error

api:
  encryption:
    key: !secret encryption_key
  # Required for ha_autopanel to call HA services (light.turn_on/off, switch.toggle)
  # and subscribe to state_changed events. Without these the C++ component won't link.
  homeassistant_services: true
  homeassistant_states: true
  on_client_connected:
    - logger.log: "HA Connected!"
    # v1.22w: the auth probe + state subscription are now
    # self-triggered by the C++ component (HaAutoPanel::loop()
    # auto-detects the first API connect and queues both via
    # pending flags, processed in subsequent loop ticks).
    # The YAML lambdas that used to live here are gone - they
    # allocated a std::function each invocation, and on a
    # wedged C6 with a fragmented heap that allocation throw
    # landed in the httpd worker context, which
    # -fno-exceptions turned into abort() at PC 0x480dbxxx
    # (see [[feedback_yaml_lambda_std_function_throw]] for
    # the first live evidence at 12:21:05.762). The C++
    # flag-based deferral is allocation-free in the hot path.

# Built-in web server provides the underlying HTTP transport. ha_autopanel
# registers its /autopanel setup form and /autopanel/save POST handler
# against this base. The panel UI is not served here; it's drawn on
# the LVGL display.
web_server:
  port: 80

ota:
  - platform: esphome

# Time source for the title bar clock. SNTP works on most networks
# but the test box here can't reach UDP/123 outbound. The homeassistant
# time source would be the cleanest fix (asks HA via the API, no
# extra port) but it triggers a git-context dependency-resolution
# error in the IDF build when the build dir isn't itself a git
# repo. For now, keep SNTP and accept that the title bar shows
# "--:--" until the user's NTP network policy is fixed. A future
# fix should swap this for the homeassistant platform and put the
# build dir back inside the project.
time:
  - platform: sntp
    id: sntp_time
    servers:
      - 0.pool.ntp.org
      - time.google.com
      - time.cloudflare.com
    timezone: "America/New_York"
    on_time_sync:
      then:
        - logger.log: "NTP time synced"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret my_ap_password
  on_connect:
    then:
      - delay: 1s
      - logger.log: "WiFi connected, triggering dynamic discovery..."
      - lambda: 'id(dynamic_discovery).trigger_discovery();'

i2c:
  - id: bus_a
    sda: GPIO45
    scl: GPIO46
    frequency: 400kHz

output:
  - platform: ledc
    pin: GPIO31
    id: backlight_pwm
  - platform: gpio
    id: power_light
    pin: GPIO29
    inverted: true
  - platform: gpio
    id: amp_ctrl
    pin: GPIO30

light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_pwm
    id: back_light
    restore_mode: ALWAYS_ON
    internal: true

http_request:
  id: ha_http

touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: bus_a
    reset_pin: GPIO40
    interrupt_pin: GPIO42
    update_interval: 50ms
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    # on_touch:
    #   - logger.log: "Touch detected"

display:
  - platform: mipi_dsi
    id: my_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    reset_pin:
      number: GPIO41
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 1024
      height: 600
    color_order: RGB
    color_depth: 16

font:
  - file: "gfonts://Roboto"
    id: font_xl
    size: 28
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_lg
    size: 24
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_md
    size: 20
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_sm
    size: 16
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_button
    size: 14
    bpp: 4

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  buffer_size: 100%
  full_refresh: true
  byte_order: little_endian
  color_depth: 16
  log_level: INFO
  bg_color: 0x111827
  text_font: font_xl  # default; the ha_autopanel C++ swaps to font_lg / font_md / font_sm for long room names
  # Flex layout is enabled by the ha_autopanel component's __init__.py
  # (it calls lvgl.defines.add_define("LV_USE_FLEX", "1") since the
  # lv_use_flex YAML key isn't part of the lvgl config schema). The
  # title-bar right cluster and the room-card rows both use
  # lv_obj_set_flex_flow so the layout reflows across screen widths.
  widgets:
    # Widgets needed by dynamic_entity_discovery component
    - arc: {}
    - label: {}

external_components:
  - source:
      type: local
      path: C:/ESPHome_Projects/esphome_dynamic_entity_discovery/components
    components: [ha_autopanel]

ha_autopanel:
  id: dynamic_discovery
  # ha_api_url and ha_api_password are still required here for now,
  # but in the no-code vision they will move to LittleFS and be set
  # via the /autopanel web form. defaults below are empty so the user
  # doesn't have to hardcode area/entity/domain filters.
  ha_api_url: "http://homeassistant.local:8123"
  ha_api_password: !secret my_ha_api_password
  http_request_ref: ha_http
  # Wire the title bar clock to the SNTP time source. The id has
  # to match the `id:` in the `time:` block above.
  time_ref: sntp_time
  # Auto-fit square-card layout
  #
  # v1.22c (Fix #7): to test the panel UI at a smaller screen size
  # (e.g. simulating a 4" or 2.8" panel on the same 7" Crowpanel
  # hardware), edit these three lines:
  #   - card_width  : shrink to fit one card per row (160 = 4" panel)
  #   - screen_width: 480 (4") / 320 (2.8") / 240 (1.28")
  #   - screen_height: 320 / 320 / 240
  # The flex layout in ha_autopanel auto-reflows cards to the new
  # width, so no other yaml change is needed. The 1024x600 values
  # here are the 7" Crowpanel defaults; don't ship production with
  # smaller numbers unless you're actually targeting a smaller
  # panel.
  card_width: 256 # change is intentional by Troy
  card_gap: 8
  screen_width: 1024
  screen_height: 600
  start_x: 0
  start_y: 40
  default_on_pct: 30
  # AGENT_DEBUG: opt-in switch that exposes /autopanel/test/* HTTP
  # endpoints (click, scroll, cmd, state) and /autopanel/screenshot.jpg.
  # The test harness uses these to drive the panel without holding the
  # serial port. Default in the component is false; flip to true in
  # this test config so bft.py / run_tests.py can hit the test API.
  # Production yml should leave it at the default.
  agent_debug: true
  # v1.22s: title bar knobs (test overrides for verification).
  # Flip use_24h_time and weather_entity_id to verify the
  # new features; the panel's stock yaml uses the default
  # 12h time + weather.home (which 404s silently if the
  # user's HA doesn't have a weather.home entity).
  # use_24h_time: true
  weather_entity_id: "weather.forecast_home"
  # enable_stuck_task_recovery: defaults to false. The user
  # wants visibility first, recovery second. The C6 reset
  # GPIO (v1.22y) is wired in the C++ side but the knob
  # stays off in this test yaml because the 5s eBlocked
  # threshold fired on every boot during v1.22y testing -
  # normal C6 init takes 5-10s. With the 30s threshold
  # (v1.22z), the recovery is more conservative, but the
  # default is still off. Flip to true to enable the
  # graduated recovery sequence (log -> drop httpd worker
  # priority -> C6 reset via GPIO32 -> App.reboot after
  # 3 recoveries in a window).
  # enable_stuck_task_recovery: true

captive_portal:
