# Test config for ha_autopanel component with LVGL
# This validates LVGL widget creation

substitutions:
  friendly_name: test-dynamic
  esphome_version: "2026.4.5" # pip install esphome==2026.4.5

esphome:
  name: test-dynamic-discovery
  # build_path: y:/esphome_test-dynamic-discovery
  friendly_name: ${friendly_name}
  on_boot:
    priority: -1000
    then:
      - logger.log: "Backlight ON"
      - output.turn_on: backlight_pwm
      - delay: 200ms
      - output.turn_off: power_light
      - delay: 500ms
      - light.turn_on:
          id: back_light
          brightness: 1

esp32:
  variant: esp32p4
  engineering_sample: true
  cpu_frequency: 360MHZ
  flash_size: 16MB
  # Custom partition table reserves 1MB on the 'storage' partition for
  # LittleFS. ha_autopanel mounts this at /storage and stores the
  # device config there.
  partitions: partitions.csv
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true

psram:
  speed: 200MHz

# Re-enable the IDF native esp_littlefs component (the C++ component
# also calls include_builtin_idf_component() for safety).
idf_components:
  - name: espressif__esp_littlefs

esp_ldo:
  - channel: 3
    voltage: 2.5V
  - channel: 4
    voltage: 2.5V

esp32_hosted:
  variant: esp32c6
  active_high: true
  reset_pin: GPIO32
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  sdio_frequency: 10MHz

logger:
  hardware_uart: UART0 # alternatively, USB_SERIAL_JTAG
  level: INFO
  # logs:
  #   ha_autopanel: error

api:
  encryption:
    key: !secret encryption_key
  # Required for ha_autopanel to call HA services (light.turn_on/off, switch.toggle)
  # and subscribe to state_changed events. Without these the C++ component won't link.
  homeassistant_services: true
  homeassistant_states: true
  on_client_connected:
    - logger.log: "HA Connected!"
    # Probe HA's authorization to perform service actions. If the device
    # isn't allowed (the integration's "Allow Home Assistant actions"
    # option is off, or the device hasn't been added to HA yet), the
    # probe times out and the panel shows NOT_AUTHORIZED with a Retry
    # button. If the probe succeeds, the panel stays in READY.
    - delay: 1s
    - lambda: 'id(dynamic_discovery).trigger_auth_probe();'
    # Subscribe to state changes once the API is fully up.
    - delay: 1s
    - lambda: 'id(dynamic_discovery).trigger_subscription();'

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret my_ap_password
  on_connect:
    then:
      - delay: 1s
      - logger.log: "WiFi connected, triggering dynamic discovery..."
      - lambda: 'id(dynamic_discovery).trigger_discovery();'

i2c:
  - id: bus_a
    sda: GPIO45
    scl: GPIO46
    frequency: 400kHz

output:
  - platform: ledc
    pin: GPIO31
    id: backlight_pwm
  - platform: gpio
    id: power_light
    pin: GPIO29
    inverted: true
  - platform: gpio
    id: amp_ctrl
    pin: GPIO30

light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_pwm
    id: back_light
    restore_mode: ALWAYS_ON
    internal: true

http_request:
  id: ha_http

touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: bus_a
    reset_pin: GPIO40
    interrupt_pin: GPIO42
    update_interval: 50ms
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    on_touch:
      - logger.log: "Touch detected"

display:
  - platform: mipi_dsi
    id: my_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    reset_pin:
      number: GPIO41
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 1024
      height: 600
    color_order: RGB
    color_depth: 16

font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 28
    bpp: 4
    
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  buffer_size: 100%
  full_refresh: true
  byte_order: little_endian
  color_depth: 16
  log_level: INFO
  bg_color: 0x111827
  text_font: font_large
  widgets:
    # Widgets needed by dynamic_entity_discovery component
    - arc: {}
    - label: {}

external_components:
  - source:
      type: local
      path: C:/ESPHome_Projects/esphome_dynamic_entity_discovery/components
    components: [ha_autopanel]

ha_autopanel:
  id: dynamic_discovery
  # ha_api_url and ha_api_password are still required here for now,
  # but in the no-code vision they will move to LittleFS and be set
  # via the /autopanel web form. defaults below are empty so the user
  # doesn't have to hardcode area/entity/domain filters.
  ha_api_url: "http://homeassistant.local:8123"
  ha_api_password: !secret my_ha_api_password
  http_request_ref: ha_http
  # Auto-fit square-card layout
  card_width: 250
  card_gap: 12
  screen_width: 1024
  screen_height: 600
  start_x: 10
  start_y: 12
  default_on_pct: 30

captive_portal:
