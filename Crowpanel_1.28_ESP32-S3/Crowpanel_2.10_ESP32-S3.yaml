# ESPHome Crowpanel 2.1" ESP32-S3
# Tested with ESPHome 2026.4.5

substitutions:
  friendly_name: Rotary2.1-inch
  esphome_version: "2026.4.5"

esphome:
  name: elecrowrotary210-inch
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  friendly_name: ${friendly_name}
  on_boot:
    priority: 800
    then:
      - output.turn_on: lcd_power
      - output.turn_on: display_reset
      - delay: 100ms
      - output.turn_off: display_reset
      - delay: 100ms
      - output.turn_on: tp_reset
      - delay: 100ms
      - output.turn_off: tp_reset
      - delay: 120ms
      - output.turn_on: tp_reset
      - delay: 120ms
      - output.turn_on: tp_intr

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: recommended

logger:
  level: DEBUG

api:
  encryption:
    key: !secret encryption_key
  on_client_connected:
    - logger.log: "HA Connected! Syncing initial button states..."
    - delay: 1s
    - script.execute: update_living_room_button
    - script.execute: update_kitchen_button
    - script.execute: sync_living_room_brightness
    - script.execute: sync_kitchen_brightness

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: "6T3RFWEF71"

psram:
  mode: octal
  speed: 80MHz

time:
  - platform: homeassistant
    id: esptime

globals:
  - id: heating_on
    type: bool
    initial_value: 'false'
  - id: display_dimmed
    type: bool
    initial_value: 'false'
  - id: current_page
    type: int
    initial_value: '0'
  - id: living_room_brightness
    type: int
    initial_value: '50'
  - id: kitchen_brightness
    type: int
    initial_value: '50'

i2c:
  - id: i2c_touch
    setup_priority: 400
    sda: GPIO38
    scl: GPIO39
    scan: true
    frequency: 400kHz

pcf8574:
  - id: pcf
    address: 0x21

output:
  - platform: ledc
    pin: GPIO6
    id: bl_pwm
    frequency: 19531Hz
  - platform: gpio
    id: lcd_power
    pin:
      pcf8574: pcf
      number: 3
      mode:
        output: true
  - platform: gpio
    id: tp_reset
    pin:
      pcf8574: pcf
      number: 0
      mode:
        output: true
  - platform: gpio
    id: display_reset
    pin:
      pcf8574: pcf
      number: 4
      mode:
        output: true
      inverted: true
  - platform: gpio
    id: tp_intr
    pin:
      pcf8574: pcf
      number: 2
      mode:
        output: true
light:
  - platform: monochromatic
    name: "Crowpanel Backlight"
    output: bl_pwm
    id: back_light
    internal: true
    restore_mode: ALWAYS_ON
sensor:
  - platform: rotary_encoder
    id: knob
    name: "Encoder"
    pin_a:
      number: GPIO4
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO42
      mode:
        input: true
        pullup: true
    resolution: 1
    min_value: -100000
    max_value: 100000
    on_clockwise:
      then:
        - lambda: |-
            if (id(current_page) == 0) {
              int new_brightness = id(living_room_brightness) + 10;
              if (new_brightness > 100) new_brightness = 100;
              id(living_room_brightness) = new_brightness;
            } else {
              int new_brightness = id(kitchen_brightness) + 10;
              if (new_brightness > 100) new_brightness = 100;
              id(kitchen_brightness) = new_brightness;
            }
        - if:
            condition:
              lambda: "return id(current_page) == 0;"
            then:
              - lvgl.arc.update:
                  id: brightness_arc
                  value: !lambda "return id(living_room_brightness);"
              - script.execute: send_brightness
        - if:
            condition:
              lambda: "return id(current_page) == 1;"
            then:
              - lvgl.arc.update:
                  id: kitchen_brightness_arc
                  value: !lambda "return id(kitchen_brightness);"
              - script.execute: send_kitchen_brightness
    on_anticlockwise:
      then:
        - lambda: |-
            if (id(current_page) == 0) {
              int new_brightness = id(living_room_brightness) - 10;
              if (new_brightness < 0) new_brightness = 0;
              id(living_room_brightness) = new_brightness;
            } else {
              int new_brightness = id(kitchen_brightness) - 10;
              if (new_brightness < 0) new_brightness = 0;
              id(kitchen_brightness) = new_brightness;
            }
        - if:
            condition:
              lambda: "return id(current_page) == 0;"
            then:
              - lvgl.arc.update:
                  id: brightness_arc
                  value: !lambda "return id(living_room_brightness);"
              - script.execute: send_brightness
        - if:
            condition:
              lambda: "return id(current_page) == 1;"
            then:
              - lvgl.arc.update:
                  id: kitchen_brightness_arc
                  value: !lambda "return id(kitchen_brightness);"
              - script.execute: send_kitchen_brightness
  - platform: homeassistant
    id: current_temperature
    entity_id: climate.front_room
    attribute: current_temperature
  - platform: homeassistant
    id: ha_living_room_brightness
    entity_id: sensor.living_room_overall_brightness
    on_value:
      then:
        - lambda: "id(living_room_brightness) = static_cast<int>(x);"
        - lvgl.arc.update:
            id: brightness_arc
            value: !lambda "return id(living_room_brightness);"
        - lvgl.label.update:
            id: brightness_label
            text: !lambda |-
                char buf[8];
                snprintf(buf, sizeof(buf), "%d%%", id(living_room_brightness));
                return std::string(buf);
  - platform: homeassistant
    id: ha_kitchen_brightness
    entity_id: sensor.kitchen_overall_brightness
    on_value:
      then:
        - lambda: "id(kitchen_brightness) = static_cast<int>(x);"
        - lvgl.arc.update:
            id: kitchen_brightness_arc
            value: !lambda "return id(kitchen_brightness);"
        - lvgl.label.update:
            id: kitchen_brightness_label
            text: !lambda |-
                char buf[8];
                snprintf(buf, sizeof(buf), "%d%%", id(kitchen_brightness));
                return std::string(buf);
text_sensor:
  - platform: homeassistant
    id: hvac_action
    entity_id: climate.front_room
    attribute: hvac_action
    on_value:
      then:
        - logger.log:
            level: INFO
            format: "hvac_action received: '%s'"
            args: x.c_str()
        - lambda: |-
            std::string action = x;
            ESP_LOGI("knob", "hvac_action: '%s'", action.c_str());

binary_sensor:
  - platform: gpio
    name: "Encoder Button"
    pin:
      pcf8574: pcf
      number: 5
      mode:
        input: true
      inverted: true
    id: rotary_button
    on_press:
      then:
        - logger.log: "Button pressed!"
        - lambda: |-
            id(current_page) = (id(current_page) + 1) % 2;
            ESP_LOGI("knob", "Switching to page %d", id(current_page));
        - if:
            condition:
              lambda: "return id(current_page) == 0;"
            then:
              - lvgl.page.show: lights_page
        - if:
            condition:
              lambda: "return id(current_page) == 1;"
            then:
              - lvgl.page.show: kitchen_page
        - script.execute: screentime
  - platform: touchscreen
    id: touch_wake
    touchscreen_id: touch
    x_min: 0
    y_min: 0
    x_max: 480
    y_max: 480
    on_press:
      then:
        - if:
            condition:
              lambda: "return id(display_dimmed);"
            then:
              - light.turn_on: back_light
              - lambda: "id(display_dimmed) = false;"
              - script.execute: screentime
  - platform: homeassistant
    id: ha_living_room_state
    entity_id: binary_sensor.living_room_any_lights_on
    on_state:
      then:
        - script.execute: update_living_room_button
  - platform: homeassistant
    id: ha_kitchen_state
    entity_id: binary_sensor.kitchen_any_lights_on
    on_state:
      then:
        - script.execute: update_kitchen_button

script:
  - id: screentime
    mode: restart
    then:
      - light.turn_on: back_light
      - lambda: "id(display_dimmed) = false;"
      - delay: 30s
      - light.turn_off: back_light
      - lambda: "id(display_dimmed) = true;"
  - id: dim_screen
    then:
      - light.turn_on:
          id: back_light
          brightness: 30%
  - id: bright_screen
    then:
      - light.turn_on:
          id: back_light
          brightness: 100%
  - id: send_brightness
    mode: restart
    then:
      - lvgl.label.update:
          id: brightness_label
          text: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%d%%", id(living_room_brightness));
              return std::string(buf);
      - delay: 300ms
      - logger.log:
          level: INFO
          format: "Sending brightness %d to living_room"
          args: id(living_room_brightness)
      - homeassistant.service:
          service: light.turn_on
          data:
            area_id: living_room
            brightness_pct: !lambda "return id(living_room_brightness);"
  - id: send_kitchen_brightness
    mode: restart
    then:
      - lvgl.label.update:
          id: kitchen_brightness_label
          text: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%d%%", id(kitchen_brightness));
              return std::string(buf);
      - delay: 300ms
      - logger.log:
          level: INFO
          format: "Sending brightness %d to kitchen"
          args: id(kitchen_brightness)
      - homeassistant.service:
          service: light.turn_on
          data:
            area_id: kitchen
            brightness_pct: !lambda "return id(kitchen_brightness);"
  - id: update_living_room_button
    then:
      - if:
          condition:
            lambda: 'return id(ha_living_room_state).state;'
          then:
            - lvgl.button.update:
                id: living_room_btn
                bg_color: 0xFFFF00
            - lvgl.label.update:
                id: living_room_btn_label
                text_color: 0x222222
          else:
            - lvgl.button.update:
                id: living_room_btn
                bg_color: 0x222222
            - lvgl.label.update:
                id: living_room_btn_label
                text_color: 0xFFFF00
  - id: update_kitchen_button
    then:
      - if:
          condition:
            lambda: 'return id(ha_kitchen_state).state;'
          then:
            - lvgl.button.update:
                id: kitchen_btn
                bg_color: 0x00FFFF
            - lvgl.label.update:
                id: kitchen_brightness_label
                text_color: 0x222222
          else:
            - lvgl.button.update:
                id: kitchen_btn
                bg_color: 0x222222
            - lvgl.label.update:
                id: kitchen_brightness_label
                text_color: 0x00FFFF
  - id: sync_living_room_brightness
    then:
      - lvgl.arc.update:
          id: brightness_arc
          value: !lambda "return id(living_room_brightness);"
      - lvgl.label.update:
          id: brightness_label
          text: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%d%%", id(living_room_brightness));
              return std::string(buf);
  - id: sync_kitchen_brightness
    then:
      - lvgl.arc.update:
          id: kitchen_brightness_arc
          value: !lambda "return id(kitchen_brightness);"
      - lvgl.label.update:
          id: kitchen_brightness_label
          text: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%d%%", id(kitchen_brightness));
              return std::string(buf);

spi:
  clk_pin: GPIO2
  mosi_pin: GPIO1

font:
  - file: "gfonts://Roboto"
    id: font_medium
    size: 32
    bpp: 4
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.-°% "

touchscreen:
  platform: cst816
  id: touch
  i2c_id: i2c_touch
  skip_probe: true
  update_interval: 50ms
  address: 0x15
  transform:
    swap_xy: false
    mirror_x: false
    mirror_y: false
  on_touch:
    - script.execute: screentime

display:
  - platform: st7701s
    id: round_display
    update_interval: 50ms
    spi_mode: MODE3
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: GPIO16
    de_pin: GPIO40
    hsync_pin: GPIO15
    vsync_pin: GPIO7
    pclk_pin: GPIO41
    data_pins:
      red: [GPIO46, GPIO3, GPIO8, GPIO18, GPIO17]
      green: [GPIO14, GPIO13, GPIO12, GPIO11, GPIO10, GPIO9]
      blue: [GPIO5, GPIO45, GPIO48, GPIO47, GPIO21]
    hsync_front_porch: 20
    hsync_pulse_width: 10
    hsync_back_porch: 10
    vsync_front_porch: 8
    vsync_pulse_width: 10
    vsync_back_porch: 10
    pclk_frequency: 12MHz
    pclk_inverted: true
    init_sequence:
      - [0x01]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCC, 0x10]
      - [0xCD, 0x08]
      - [0xB0, 0x02, 0x13, 0x1B, 0x0D, 0x10, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xB1, 0x05, 0x13, 0x1B, 0x0D, 0x11, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x5D]
      - [0xB1, 0x43]
      - [0xB2, 0x81]
      - [0xB3, 0x80]
      - [0xB5, 0x43]
      - [0xB7, 0x85]
      - [0xB8, 0x20]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xD0, 0x88]
      - [0xE0, 0x00, 0x00, 0x02]
      - [0xE1, 0x03, 0xA0, 0x00, 0x00, 0x04, 0xA0, 0x00, 0x00, 0x00, 0x20, 0x20]
      - [0xE2, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x00]
      - [0xE4, 0x22, 0x00]
      - [0xE5, 0x05, 0xEC, 0xA0, 0xA0, 0x07, 0xEE, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE6, 0x00, 0x00, 0x11, 0x00]
      - [0xE7, 0x22, 0x00]
      - [0xE8, 0x06, 0xED, 0xA0, 0xA0, 0x08, 0xEF, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xEB, 0x00, 0x00, 0x40, 0x40, 0x00, 0x00, 0x00]
      - [0xED, 0xFF, 0xFF, 0xFF, 0xBA, 0x0A, 0xBF, 0x45, 0xFF, 0xFF, 0x54, 0xFB, 0xA0, 0xAB, 0xFF, 0xFF, 0xFF]
      - [0xEF, 0x10, 0x0D, 0x04, 0x08, 0x3F, 0x1F]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]
      - [0x36, 0x00]
      - [0x3A, 0x60]
      - [0x11]
      - delay 100ms
      - [0x29]
      - delay 50ms

lvgl:
  displays:
    - round_display
  default_font: font_medium
  touchscreens:
    touchscreen_id: touch
  pages:
    - id: lights_page
      widgets:
        - obj:
            height: 480
            width: 480
            align: CENTER
            pad_all: 0
            border_width: 0
            bg_color: 0x111827
            widgets:
              - label:
                  text: "LIVING ROOM"
                  text_color: 0xFFFFFF
                  align: CENTER
                  y: -20
              - label:
                  id: brightness_label
                  text: "50%"
                  text_color: 0xFFFFFF
                  align: CENTER
                  y: 40
              - arc:
                  id: brightness_arc
                  x: 40
                  y: 45
                  width: 400
                  height: 400
                  value: 50
                  min_value: 0
                  max_value: 100
                  start_angle: 135
                  end_angle: 45
                  arc_color: 0x404040
                  arc_width: 40
                  indicator:
                    arc_color: 0xFFFF00
                    arc_width: 40
                  knob:
                    bg_color: 0xFFFFFF
                    radius: 9999
                    border_width: 6
                    border_color: 0xFFFF00
                  adjustable: true
                  on_value:
                    then:
                      - lambda: "id(living_room_brightness) = x;"
                      - script.execute: send_brightness
                      - script.execute: screentime
              - button:
                  x: 140
                  y: 355
                  width: 200
                  height: 80
                  radius: 12
                  border_width: 4
                  border_color: 0xFFFF00
                  bg_color: 0x222222
                  id: living_room_btn
                  on_click:
                    then:
                      - if:
                          condition:
                            lambda: "return id(display_dimmed);"
                          then:
                            - light.turn_on: back_light
                            - lambda: "id(display_dimmed) = false;"
                            - script.execute: screentime
                          else:
                            - if:
                                condition:
                                  lambda: "return id(ha_living_room_state).state;"
                                then:
                                  - homeassistant.service:
                                      service: light.turn_off
                                      data:
                                        area_id: living_room
                                else:
                                  - if:
                                      condition:
                                        lambda: "return id(living_room_brightness) == 0;"
                                      then:
                                        - lambda: "id(living_room_brightness) = 50;"
                                        - lvgl.arc.update:
                                            id: brightness_arc
                                            value: 50
                                        - lvgl.label.update:
                                            id: brightness_label
                                            text: "50%"
                                  - homeassistant.service:
                                      service: light.turn_on
                                      data:
                                        area_id: living_room
                                        brightness_pct: !lambda "return id(living_room_brightness);"
                            - script.execute: screentime
                  widgets:
                    - label:
                        id: living_room_btn_label
                        text: "ON/OFF"
                        text_color: 0xFFFF00
                        text_font: font_medium
                        align: CENTER
    - id: kitchen_page
      widgets:
        - obj:
            height: 480
            width: 480
            align: CENTER
            pad_all: 0
            border_width: 0
            bg_color: 0x111827
            widgets:
              - label:
                  text: "KITCHEN"
                  text_color: 0xFFFFFF
                  align: CENTER
                  y: -20
              - label:
                  id: kitchen_brightness_label
                  text: "50%"
                  text_color: 0xFFFFFF
                  align: CENTER
                  y: 40
              - arc:
                  id: kitchen_brightness_arc
                  x: 40
                  y: 45
                  width: 400
                  height: 400
                  value: 50
                  min_value: 0
                  max_value: 100
                  start_angle: 135
                  end_angle: 45
                  arc_color: 0x404040
                  arc_width: 40
                  indicator:
                    arc_color: 0x00FFFF
                    arc_width: 40
                  knob:
                    bg_color: 0xFFFFFF
                    radius: 9999
                    border_width: 6
                    border_color: 0x00FFFF
                  adjustable: true
                  on_value:
                    then:
                      - lambda: "id(kitchen_brightness) = x;"
                      - script.execute: send_kitchen_brightness
                      - script.execute: screentime
              - button:
                  x: 140
                  y: 355
                  width: 200
                  height: 80
                  radius: 12
                  border_width: 4
                  border_color: 0x00FFFF
                  bg_color: 0x222222
                  id: kitchen_btn
                  on_click:
                    then:
                      - if:
                          condition:
                            lambda: "return id(display_dimmed);"
                          then:
                            - light.turn_on: back_light
                            - lambda: "id(display_dimmed) = false;"
                            - script.execute: screentime
                          else:
                            - if:
                                condition:
                                  lambda: "return id(ha_kitchen_state).state;"
                                then:
                                  - homeassistant.service:
                                      service: light.turn_off
                                      data:
                                        area_id: kitchen
                                else:
                                  - if:
                                      condition:
                                        lambda: "return id(kitchen_brightness) == 0;"
                                      then:
                                        - lambda: "id(kitchen_brightness) = 50;"
                                        - lvgl.arc.update:
                                            id: kitchen_brightness_arc
                                            value: 50
                                        - lvgl.label.update:
                                            id: kitchen_brightness_label
                                            text: "50%"
                                  - homeassistant.service:
                                      service: light.turn_on
                                      data:
                                        area_id: kitchen
                                        brightness_pct: !lambda "return id(kitchen_brightness);"
                            - script.execute: screentime
                  widgets:
                    - label:
                        id: kitchen_btn_label
                        text: "ON/OFF"
                        text_color: 0x00FFFF
                        text_font: font_medium
                        align: CENTER
captive_portal:
