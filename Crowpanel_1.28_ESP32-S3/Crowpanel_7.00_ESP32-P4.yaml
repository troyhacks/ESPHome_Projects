interval:
  - interval: 5s
    then:
      - lambda: |-
          // Update WiFi RSSI
          int rssi = WiFi.RSSI();
          char rssi_buf[20];
          snprintf(rssi_buf, sizeof(rssi_buf), "%d dBm", rssi);
          lv_label_set_text(id(wifi_rssi), rssi_buf);
      - lambda: |-
          // Update free memory
          uint32_t free_heap = esp_get_free_heap_size();
          char mem_buf[20];
          snprintf(mem_buf, sizeof(mem_buf), "%lu KB", free_heap / 1024);
          lv_label_set_text(id(free_memory), mem_buf);

