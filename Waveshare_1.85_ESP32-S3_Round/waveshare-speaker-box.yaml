substitutions:
  device_name: waveshare-speaker-box
  friendly_name: WaveShare Speaker Box
  bat_adc_pin: GPIO8
  divider_ratio: "3.0"
  calibration_offset: "0.990476"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended
  flash_size: 16MB
  partitions: WS-Speaker-Box/partitions.csv

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

web_server:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "SpeakerBox Fallback"

captive_portal:

# ── I2C for expander/touch ──
i2c:
  id: bus_a
  sda: GPIO11
  scl: GPIO10
  frequency: 400kHz
  scan: true

pca9554:
  - id: io_expander
    address: 0x20

# ── Backlight (GPIO5) ──
output:
  - platform: ledc
    id: lcd_backlight_pwm
    pin: GPIO5
    frequency: 1000Hz
    min_power: 0.1
    max_power: 1.0

light:
  - platform: monochromatic
    id: lcd_backlight
    name: "LCD Backlight"
    output: lcd_backlight_pwm
    restore_mode: ALWAYS_ON
    gamma_correct: 2.2

# ── Quad-SPI bus ──
spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO40
    data_pins:
      - number: GPIO46
        ignore_strapping_warning: true
      - number: GPIO45
        ignore_strapping_warning: true
      - GPIO42
      - GPIO41

# ── Display (mipi_spi recommended over deprecated qspi_dbi) ──
display:
  - platform: mipi_spi
    id: main_lcd
    model: JC3636W518
    cs_pin: GPIO21
    reset_pin: { pca9554: io_expander, number: 1, mode: { output: true } }
    bus_mode: quad
    dimensions:
      width: 360
      height: 360
    color_order: bgr
    data_rate: 20MHz
    buffer_size: 50%

# ── Touchscreen ──
touchscreen:
  - platform: cst816
    id: touch
    i2c_id: bus_a
    address: 0x15
    interrupt_pin: GPIO4
    reset_pin:
      pca9554: io_expander
      number: 0
      mode: { output: true }
    skip_probe: true

# ── LVGL Fonts ──
font:
  - file: "fonts/Montserrat-Medium.ttf"
    id: font_36
    size: 36
  - file: "fonts/Montserrat-Medium.ttf"
    id: font_24
    size: 24
  - file: "fonts/Montserrat-Medium.ttf"
    id: font_18
    size: 18

# ── Simple shape-based LVGL UI ──
lvgl:
  displays:
    - main_lcd
  touchscreens:
    - touch
  pages:
    - id: main_page
      bg_color: 0x111122
      widgets:

        # ── Full-screen tap-to-wake (behind everything) ──
        - obj:
            id: tap_area
            x: 0
            y: 0
            width: 360
            height: 360
            bg_opa: 0
            clickable: false
            on_click:
              then:
                - micro_wake_word.start

        # ── Center: State label ──
        - label:
            id: state_label
            x: 0
            y: 100
            width: 360
            align: CENTER
            text: "IDLE"
            text_color: 0x44FF44
            text_font: font_36

        # ── Top-right: Mute button ──
        - button:
            id: mute_btn
            x: 260
            y: 10
            width: 90
            height: 44
            radius: 8
            bg_color: 0x333344
            on_click:
              then:
                - voice_assistant.stop
            widgets:
              - label:
                  id: mute_label
                  align: CENTER
                  text: "MIC ON"
                  text_color: 0x44FF44

        # ── Volume label ──
        - label:
            id: vol_label
            x: 0
            y: 220
            width: 360
            align: CENTER
            text: "Volume"
            text_color: 0x888899

        # ── Volume slider ──
        - slider:
            id: vol_slider
            x: 40
            y: 250
            width: 280
            height: 36
            min_value: 50
            max_value: 100
            value: 80
            bg_color: 0x333344
            radius: 10
            on_state_change:
              then:
                - media_player.volume_set:
                    id: speaker_media_player
                    volume: !lambda return lv_slider_get_value(id(vol_slider)) / 100.0;

# ══════════════════════════════════════════════════════
#  VOICE PIPELINE  (inlined from waveshare-speaker-box-voice.yaml)
# ══════════════════════════════════════════════════════

# I²S buses
i2s_audio:
  # Mic (input)
  - id: audio_bus_in
    i2s_lrclk_pin: GPIO2
    i2s_bclk_pin: GPIO15
  # DAC (output)
  - id: audio_bus_out
    i2s_lrclk_pin: GPIO38
    i2s_bclk_pin: GPIO48

microphone:
  - platform: i2s_audio
    id: esp32_microphone
    i2s_audio_id: audio_bus_in
    adc_type: external
    i2s_din_pin: GPIO39
    channel: right
    sample_rate: 16000
    bits_per_sample: 32bit

speaker:
  - platform: i2s_audio
    id: esp32_speaker
    i2s_audio_id: audio_bus_out
    i2s_dout_pin: GPIO47
    dac_type: external
    channel: mono
    sample_rate: 48000
    bits_per_sample: 16bit
    buffer_duration: 100ms
    i2s_comm_fmt: stand_i2s

  - platform: mixer
    id: audio_mixer
    output_speaker: esp32_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

media_player:
  - platform: speaker
    name: "WS Speaker Box Media Player"
    id: speaker_media_player
    codec_support_enabled: true
    volume_min: 50%
    volume_max: 100%
    volume_increment: 5%

    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1

    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1

    on_announcement:
      - if:
          condition:
            microphone.is_capturing
          then:
            - micro_wake_word.stop
            - voice_assistant.stop
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0s
      - delay: 100ms

    on_state:
      - if:
          condition:
            and:
              - not: voice_assistant.is_running
              - not: media_player.is_announcing
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1s

    on_play:
      - logger.log:
          tag: main
          level: DEBUG
          format: "Media player started playing, disabling microphone"
      - delay: 100ms
      - micro_wake_word.stop
      - voice_assistant.stop

    on_idle:
      - delay: 100ms
      - if:
          condition:
            not: voice_assistant.is_running
          then:
            - micro_wake_word.start

sensor:
  # Voice assistant state
  - platform: template
    name: "Voice Assistant State"
    update_interval: 2s
    lambda: |-
      return id(esp32_microphone).is_running() ? 1 : 0;

  # Battery voltage (ADC)
  - platform: adc
    id: bat_voltage
    name: "${friendly_name} Battery Voltage"
    pin: ${bat_adc_pin}
    attenuation: 12db
    update_interval: 10s
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - lambda: |-
          return (x * ${divider_ratio}) / ${calibration_offset};

  # Battery percentage
  - platform: template
    id: bat_percent
    name: "${friendly_name} Battery"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      const float v = id(bat_voltage).state;
      if (isnan(v)) return NAN;
      float pct;
      if      (v <= 3.30f) pct = 0.0f;
      else if (v >= 4.20f) pct = 100.0f;
      else {
        if      (v < 3.50f) pct =  (v - 3.30f) * (10.0f / (3.50f - 3.30f));
        else if (v < 3.70f) pct = 10.0f + (v - 3.50f) * (40.0f / (3.70f - 3.50f));
        else if (v < 3.95f) pct = 50.0f + (v - 3.70f) * (40.0f / (3.95f - 3.70f));
        else                pct = 90.0f + (v - 3.95f) * (10.0f / (4.20f - 3.95f));
      }
      if (pct < 0.0f)   pct = 0.0f;
      if (pct > 100.0f) pct = 100.0f;
      return pct;

text_sensor:
  - platform: template
    name: "Voice Assistant Status"
    id: voice_status
    update_interval: 5s
    lambda: |-
      if (id(esp32_microphone).is_running()) {
        return {"Listening"};
      } else {
        return {"Idle"};
      }

micro_wake_word:
  id: my_wake_word
  models:
    - model: alexa
  on_wake_word_detected:
    then:
      - logger.log: "Wake word detected"
      - micro_wake_word.stop
      - voice_assistant.start:
          wake_word: !lambda return wake_word;

voice_assistant:
  microphone: esp32_microphone
  media_player: speaker_media_player
  micro_wake_word: my_wake_word
  noise_suppression_level: 0
  auto_gain: 15dBFS
  volume_multiplier: 2.0
  conversation_timeout: 300s

  on_start:
    - logger.log: "VA started"

  on_stt_end:
    - logger.log:
        format: "You said: %s"
        args: [x]

  on_error:
    - logger.log:
        level: ERROR
        format: "VA error %d: %s"
        args: [code, message]
    - micro_wake_word.start

  on_end:
    - wait_until:
        condition: media_player.is_announcing
        timeout: 0.5s
    - wait_until:
        condition:
          and:
            - not: media_player.is_announcing
            - not: media_player.is_playing
    - micro_wake_word.start

  on_client_connected:
    - micro_wake_word.start
  on_client_disconnected:
    - micro_wake_word.stop
